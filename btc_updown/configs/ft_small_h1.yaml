# Long-horizon test: Kronos-small fine-tuned on HOURLY bars (h1_* series from data/resample.py) with a 24-bar DirectHead,
# so the head prices the Polymarket 4-hour and daily windows and the Kalshi daily ladder (h = 1..24 hours).
# Kline cutoff before the first Polymarket daily market (2025-03-15); kline validation on 2025-03-15 .. 2025-05-01
# (checkpoint selection only). Run with BTC_UPDOWN_BAR_SECONDS=3600.
exp_name: ft_small_h1
run_dir: /workspace/runs/{exp_name}
expected_hours: 1.0
seed: 100
device: auto
bf16: true

data:
  root: /workspace/klines
  train_series: [h1_spot_BTCUSDC, h1_spot_BTCUSDT, h1_um_BTCUSDT]
  val_series: [h1_spot_BTCUSDT]
  lookback: 256
  predict: 24
  clip: 5.0
  train_start: null
  train_end: "2025-03-15"
  val_start: "2025-03-15"
  val_end: "2025-05-01"
  n_val_windows: 1024
  num_workers: 6

model:
  tokenizer: NeoQuasar/Kronos-Tokenizer-base
  tokenizer_revision: null
  predictor: NeoQuasar/Kronos-small
  predictor_revision: null
  freeze_backbone: false
  direct_head: true
  head_hidden: 256
  head_dropout: 0.1
  head_max_h: 24
  head_init: null

train:
  steps: 10000
  batch_size: 64
  lr: 4.0e-5
  head_lr: 1.0e-3
  betas: [0.9, 0.95]
  weight_decay: 0.1
  grad_clip: 3.0
  pct_start: 0.03
  div_factor: 10
  teacher_forcing: false
  ce_weight: 1.0
  bce_weight: 1.0
  log_every: 50
  val_every: 1000
  ckpt_every: 1000
  keep_last: 2
  val_batch_size: 64

val_labels: null
val_label_points: 500
