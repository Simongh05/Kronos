# E1b-1h: the E1b recipe (joint next-token CE + DirectHead BCE, Kronos-small, predictor only, frozen tokenizer)
# with 60-bar targets: predict 60 and the (j, h) grid up to j + h <= 60 (the hourly-market geometry).
# Window = 256 + 60 = 316 tokens; ~1.2x the E1b step cost. One A40, bf16, ~1.5-2 h.
exp_name: ft_small_1h
run_dir: /workspace/runs/{exp_name}
expected_hours: 2
seed: 100
device: auto
bf16: true

data:
  root: /workspace/klines
  train_series: [spot_BTCUSDC, spot_BTCUSDT, um_BTCUSDT]
  val_series: [spot_BTCUSDC]
  lookback: 256
  predict: 60
  clip: 5.0
  train_start: null
  train_end: "2026-08-01"    # every training window closes before this
  val_start: "2026-08-07"
  val_end: "2026-09-07"
  n_val_windows: 2048
  num_workers: 6

model:
  tokenizer: NeoQuasar/Kronos-Tokenizer-base
  tokenizer_revision: null
  predictor: NeoQuasar/Kronos-small
  predictor_revision: null
  freeze_backbone: false
  direct_head: true
  head_hidden: 256
  head_dropout: 0.1
  head_max_h: 60
  head_init: null

train:
  steps: 30000
  batch_size: 64
  lr: 4.0e-5
  head_lr: 1.0e-3
  betas: [0.9, 0.95]
  weight_decay: 0.1
  grad_clip: 3.0
  pct_start: 0.03
  div_factor: 10
  teacher_forcing: false
  ce_weight: 1.0
  bce_weight: 1.0
  log_every: 50
  val_every: 2500
  ckpt_every: 2500
  keep_last: 2
  val_batch_size: 64

val_labels: null
val_label_points: 500
