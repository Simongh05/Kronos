# Kalshi KXBTCD ladders: backbone hidden state per minute (the 60-minute head is then applied at every ladder strike on
# the Mac) plus the j + h == 60 direct logits as a cross-check, 2026-08-20 .. 10-24 (the API's retention window).
exp_name: cube_e1b_hidden_kalshi
run_dir: /workspace/cubes/{exp_name}
expected_hours: 0.3
seed: 100
device: auto
bf16: true
data: {root: /workspace/klines, series: spot_BTCUSDC, lookback: 256, clip: 5.0}
model:
  tokenizer: NeoQuasar/Kronos-Tokenizer-base
  predictor: /workspace/runs/ft_small_1m/best/model
  head: /workspace/runs/probe_small_1h/best/head.pt
cube: {start: "2026-08-20", end: "2026-10-25", stride_s: 60, pred_len: 15, n_samples: 1, T: 1.0, top_p: 1.0, top_k: 0,
       batch_points: 256, sampling: false, direct: true, direct_sum_only: true, store_paths: false, dump_hidden: true}
